<!-- @dsCard group="Estrutura" -->
<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.0/dist/core.min.css">
</head>
<body style="margin: 0; background: var(--background); color: var(--color); font-family: var(--font-base); padding: 2rem;">
  <div style="max-width: 1400px; margin: 0 auto;">
    <h1>Avatar</h1>

    <section style="background: var(--background-alternative); padding: 1.5rem; border-radius: var(--rounder-md); margin: 1.5rem 0;">
      <h2>Com imagem</h2>
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='24' fill='%234a90e2'/%3E%3Ctext x='24' y='32' text-anchor='middle' fill='white' font-size='20' font-weight='bold'%3EJL%3C/text%3E%3C/svg%3E" style="width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--border-color);" alt="João Luz">
    </section>

    <section style="background: var(--background-alternative); padding: 1.5rem; border-radius: var(--rounder-md); margin: 1.5rem 0;">
      <h2>Tamanhos</h2>
      <div style="display: flex; gap: 1rem; align-items: center;">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%234a90e2'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-size='12'%3EJL%3C/text%3E%3C/svg%3E" style="width: 32px; height: 32px; border-radius: 50%;" alt="">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='24' fill='%234a90e2'/%3E%3Ctext x='24' y='32' text-anchor='middle' fill='white' font-size='16'%3EJL%3C/text%3E%3C/svg%3E" style="width: 48px; height: 48px; border-radius: 50%;" alt="">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%234a90e2'/%3E%3Ctext x='32' y='42' text-anchor='middle' fill='white' font-size='22'%3EJL%3C/text%3E%3C/svg%3E" style="width: 64px; height: 64px; border-radius: 50%;" alt="">
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.0/dist/core-init.min.js"></script>
</body>
</html>
