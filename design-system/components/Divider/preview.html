<!-- @dsCard group="Estrutura" -->
<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divider</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.0/dist/core.min.css">
</head>
<body style="margin: 0; background: var(--background); color: var(--color); font-family: var(--font-base); padding: 2rem;">
  <div style="max-width: 1400px; margin: 0 auto;">
    <h1>Divisor</h1>

    <section style="margin: 1.5rem 0;">
      <h2>Horizontal</h2>
      <p>Seção 1</p>
      <hr style="border: none; border-top: 1px solid var(--border-color); margin: 1rem 0;">
      <p>Seção 2</p>
    </section>

    <section style="margin: 1.5rem 0;">
      <h2>Com label</h2>
      <div style="display: flex; align-items: center; gap: 1rem; margin: 1rem 0;">
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
        <span style="color: var(--color-secondary); white-space: nowrap; font-size: 12px;">OU</span>
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
      </div>
    </section>

    <section style="background: var(--background-alternative); padding: 1.5rem; border-radius: var(--rounder-md); margin: 1.5rem 0;">
      <h2>Uso</h2>
      <pre style="background: #f5f5f5; padding: 1rem; border-radius: 4px;"><code>&lt;hr style="border: none; border-top: 1px solid var(--border-color);"&gt;</code></pre>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.0/dist/core-init.min.js"></script>
</body>
</html>
