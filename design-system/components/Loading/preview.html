<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.0/dist/core.min.css">
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; display: inline-block; }
  </style>
</head>
<body style="margin: 0; background: var(--background); color: var(--color); font-family: var(--font-base); padding: 2rem;">
  <div style="max-width: 1400px; margin: 0 auto;">
    <h1>Indicador de Carregamento</h1>

    <section style="background: var(--background-alternative); padding: 1.5rem; border-radius: var(--rounder-md); margin: 1.5rem 0;">
      <h2>Spinner</h2>
      <div style="display: flex; gap: 2rem; align-items: center;">
        <span class="spinner" style="font-size: 40px;">⟳</span>
        <p style="margin: 0;">Carregando dados...</p>
      </div>
    </section>

    <section style="background: var(--background-alternative); padding: 1.5rem; border-radius: var(--rounder-md); margin: 1.5rem 0;">
      <h2>Barra de progresso</h2>
      <div style="background: var(--border-color); height: 4px; border-radius: 2px; overflow: hidden;">
        <div style="width: 65%; height: 100%; background: var(--interactive); animation: progress 2s ease-in-out infinite;"></div>
      </div>
      <p style="margin: 0.5rem 0 0; color: var(--color-secondary); font-size: 12px;">65% completo</p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.0/dist/core-init.min.js"></script>
</body>
</html>
