<!-- @dsCard group="Feedback" height=340 subtitle="br-message — sucesso, informação, atenção e erro" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" />
<div id="root"></div>
<script>
  const css = `
    body { margin: 0; padding: 24px; background: var(--background); color: var(--color);
           font-family: var(--font-base); font-size: 14px; line-height: 1.45; }
    .pilha { display: grid; gap: var(--spacing-2x); max-width: 760px; }
    .br-message {
      display: flex; gap: var(--spacing-2x); align-items: flex-start;
      padding: var(--spacing-2x);
      border-radius: var(--rounder-md);
      border-left: var(--width-lg) solid;
      color: var(--color);
    }
    .br-message .icone { font-size: 18px; line-height: 1.2; flex: none; }
    .br-message .titulo { font-weight: 700; }
    .br-message p { margin: var(--spacing-half) 0 0; }
    .success { background: var(--success-background); border-left-color: var(--success); }
    .success .icone { color: var(--success); }
    .info { background: var(--info-background); border-left-color: var(--info); }
    .info .icone { color: var(--info); }
    .warning { background: var(--warning-background); border-left-color: var(--warning); }
    .warning .icone { color: var(--color); }
    .danger { background: var(--danger-background); border-left-color: var(--danger); }
    .danger .icone { color: var(--danger); }
  `;
  document.head.appendChild(Object.assign(document.createElement('style'), { textContent: css }));

  document.getElementById('root').innerHTML = `
    <div class="pilha">
      <div class="br-message success" role="status">
        <span class="icone" aria-hidden="true">✓</span>
        <div><span class="titulo">Solicitação enviada.</span>
        <p>O número do protocolo é <code>23456.789012/2026-10</code>. Você receberá o acompanhamento por e-mail.</p></div>
      </div>

      <div class="br-message info" role="status">
        <span class="icone" aria-hidden="true">i</span>
        <div><span class="titulo">Antes de começar.</span>
        <p>Tenha em mãos o documento de identificação e o número do processo.</p></div>
      </div>

      <div class="br-message warning" role="status">
        <span class="icone" aria-hidden="true">!</span>
        <div><span class="titulo">Prazo encerra em 3 dias.</span>
        <p>Solicitações enviadas após 30/09 serão analisadas no próximo ciclo.</p></div>
      </div>

      <div class="br-message danger" role="alert">
        <span class="icone" aria-hidden="true">✕</span>
        <div><span class="titulo">Não foi possível enviar.</span>
        <p>O CPF informado não tem 11 dígitos. Confira o campo CPF e envie novamente.</p></div>
      </div>
    </div>
  `;
</script>
