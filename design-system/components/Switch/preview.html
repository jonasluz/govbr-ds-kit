<!-- @dsCard group="Formulário" -->
<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switch</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.0/dist/core.min.css">
</head>
<body style="margin: 0; background: var(--background); color: var(--color); font-family: var(--font-base); padding: 2rem;">
  <div style="max-width: 600px; margin: 0 auto;">
    <h1>Switch (Toggle)</h1>

    <section style="background: var(--background-alternative); padding: 1.5rem; border-radius: var(--rounder-md); margin: 1.5rem 0;">
      <h2>Exemplo</h2>
      <label style="display: flex; align-items: center; gap: 1rem; cursor: pointer;">
        <input type="checkbox" class="br-switch" aria-label="Ativar notificações">
        <span>Ativar notificações</span>
      </label>
    </section>

    <section style="background: var(--background-alternative); padding: 1.5rem; border-radius: var(--rounder-md); margin: 1.5rem 0;">
      <h2>Uso</h2>
      <pre style="background: #f5f5f5; padding: 1rem; border-radius: 4px; overflow-x: auto;"><code>&lt;label&gt;
  &lt;input type="checkbox" class="br-switch"&gt;
  &lt;span&gt;Opção habilitada&lt;/span&gt;
&lt;/label&gt;</code></pre>
    </section>

    <section style="background: var(--background-alternative); padding: 1.5rem; border-radius: var(--rounder-md); margin: 1.5rem 0;">
      <h2>Regras</h2>
      <ul>
        <li>Use para ON/OFF binárias — não para múltiplas opções.</li>
        <li>Sempre `<label>` com texto descritivo ao lado.</li>
        <li>`checked` para estado inicial ativado.</li>
        <li>`disabled` para desabilitar sem remover da tela.</li>
      </ul>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.0/dist/core-init.min.js"></script>
</body>
</html>
