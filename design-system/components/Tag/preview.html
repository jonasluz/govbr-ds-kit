<!-- @dsCard group="Estrutura" -->
<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tag</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.0/dist/core.min.css">
</head>
<body style="margin: 0; background: var(--background); color: var(--color); font-family: var(--font-base); padding: 2rem;">
  <div style="max-width: 1400px; margin: 0 auto;">
    <h1>Tag/Rótulo</h1>

    <section style="background: var(--background-alternative); padding: 1.5rem; border-radius: var(--rounder-md); margin: 1.5rem 0;">
      <h2>Exemplo</h2>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <span style="background: var(--background); border: 1px solid var(--border-color); padding: 0.25rem 0.75rem; border-radius: var(--rounder-pill); font-size: 12px;">Aprovado</span>
        <span style="background: #fff5c2; border: 1px solid #ffcd07; color: #333; padding: 0.25rem 0.75rem; border-radius: var(--rounder-pill); font-size: 12px;">Pendente</span>
        <span style="background: #fde0db; border: 1px solid #ff8d7b; color: #333; padding: 0.25rem 0.75rem; border-radius: var(--rounder-pill); font-size: 12px;">Rejeitado</span>
        <span style="background: var(--interactive-alternative); color: white; padding: 0.25rem 0.75rem; border-radius: var(--rounder-pill); font-size: 12px;">Destaque</span>
      </div>
    </section>

    <section style="background: var(--background-alternative); padding: 1.5rem; border-radius: var(--rounder-md); margin: 1.5rem 0;">
      <h2>Uso</h2>
      <pre style="background: #f5f5f5; padding: 1rem; border-radius: 4px;"><code>&lt;span class="br-tag approved"&gt;Aprovado&lt;/span&gt;</code></pre>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.0/dist/core-init.min.js"></script>
</body>
</html>
