<!-- @dsCard group="Formulário" -->
<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.0/dist/core.min.css">
</head>
<body style="margin: 0; background: var(--background); color: var(--color); font-family: var(--font-base); padding: 2rem;">
  <div style="max-width: 600px; margin: 0 auto;">
    <h1>Envio de Arquivo</h1>

    <section style="background: var(--background-alternative); padding: 1.5rem; border-radius: var(--rounder-md); margin: 1.5rem 0;">
      <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Comprovante de residência:</label>
      <input type="file" class="br-upload" accept=".pdf,.jpg,.png" aria-label="Enviar comprovante">
      <p style="color: var(--color-secondary); font-size: 12px; margin-top: 0.5rem;">Máximo 5MB, PNG, JPG ou PDF</p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.0/dist/core-init.min.js"></script>
</body>
</html>
